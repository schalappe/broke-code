name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Package (dry run of the release step)
        env:
          VERSION: 0.0.1
        run: |
          bun run package
          packaged=$(unzip -p "broke-code-$VERSION.vsix" extension/package.json | jq -r .version)
          if [ "$packaged" != "$VERSION" ]; then
            echo "::error::The VSIX carries version $packaged, expected $VERSION."
            exit 1
          fi
