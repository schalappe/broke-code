# File name fixed by the Marketplace Trusted Publishing policy.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# Two merges in a row must not compute the same version; runs queue instead of racing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - id: next
        name: Compute the next version
        run: |
          version=$(bun scripts/next-version.ts)
          if [ -n "$version" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists. Nothing is published."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run package
      # --skip-duplicate lets a re-run after a partial publish pass the registry that already has the version.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bunx --bun ovsx publish --packagePath "broke-code-$VERSION.vsix" --skip-duplicate
      - name: Publish to the Visual Studio Marketplace
        run: bunx --bun vsce publish --oidc --packagePath "broke-code-$VERSION.vsix" --skip-duplicate --no-dependencies
      # gh creates the tag together with the Release, so a failure cannot leave a tag without its Release.
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "broke-code-$VERSION.vsix" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
